[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptghost"
version = "0.1.0"
description = "Git-native behavioral diff for AI applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "gitpython>=3.1"
]

[project.scripts]
pgit = "pgit.cli:app"

[tool.setuptools.packages.find]
include = ["pgit*"]